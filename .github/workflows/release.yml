name: Release
# Run from the Actions tab (or the API) after bumping "version" in manifest.json.
# Tags main as v<version> and publishes a GitHub release, which is what the
# Marketplace (formerly HACS) offers as an update.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes (Markdown)
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          version=$(jq -r .version custom_components/hue_remote_scenes/manifest.json)
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released; bump the version in manifest.json first." >&2
            exit 1
          fi
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes "$NOTES"
